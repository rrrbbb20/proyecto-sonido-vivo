<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Inicia sesión en tu cuenta de Sonido Vivo."
    >
    <title>Iniciar sesión | Sonido Vivo</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <header class="site-header">
        <a class="site-header_logo" href="index.html">
            Sonido Vivo
        </a>

        <nav
            class="site-header_nav"
            aria-label="Navegación principal"
        >
            <ul class="site-header_menu">
                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="catalogo.html">Catálogo</a>
                </li>

                <li>
                    <a href="ubicacion.html">Ubicación</a>
                </li>

                <li>
                    <a
                        href="login.html"
                        aria-current="page"
                    >
                        Iniciar sesión
                    </a>
                </li>


                <li>
                    <a href="carrito.html">Carrito (0)</a>
                </li>
            </ul>
        </nav>
    </header>


    <main id="contenido-principal">
        <section
            class="login"
            aria-labelledby="login-title"
        >
            <h1 id="login-title">
                Iniciar sesión
            </h1>

            <p>
                Ingresa tus datos para acceder a tu cuenta.
            </p>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="correo"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="login-password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        name="contrasena"
                        autocomplete="current-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit">
                    Ingresar
                </button>
            </form>

            <p>
                ¿No tienes una cuenta?
                <a href="register.html">Regístrate aquí</a>
            </p>
        </section>
    </main>
</body>
</html>
