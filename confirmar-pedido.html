<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirma tu pedido en Sonido Vivo.">
    <title>Confirmar Pedido | Sonido Vivo</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="site-header">
        <a class="site-header_logo" href="index.html">Sonido Vivo</a>
        <nav class="site-header_nav" aria-label="Navegación principal">
            <ul class="site-header_menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="ubicacion.html">Ubicación</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-principal">
        <h1>Confirmar Pedido</h1>
        
        <section id="resumen-pedido">
            <h2>Resumen de tu compra</h2>
            <div id="lista-productos"></div>
            <h3 id="total-pedido">Total: $0</h3>
        </section>

        <section class="formulario-contacto" style="margin-top: 2rem;">
            <h2>Datos de Envío</h2>
            <form id="form-confirmacion" action="#" method="POST">
                <fieldset>
                    <div class="campo-formulario">
                        <label for="direccion">Dirección de entrega:</label>
                        <input type="text" id="direccion" name="direccion" placeholder="Ej: 1 Norte 123, Depto 402">
                        <span class="msj-error" id="error-direccion" style="color: #b42318; font-size: 0.85rem; display: block; margin-top: 0.2rem;"></span>
                    </div>
                    
        <!-- Región (Lista desplegable) -->
                    <div class="campo-formulario">
                        <label for="region">Región:</label>
                        <select id="region" name="region">
                            <option value="">Selecciona una región...</option>
                            <option value="Arica y Parinacota">Arica y Parinacota</option>
                            <option value="Tarapacá">Tarapacá</option>
                            <option value="Antofagasta">Antofagasta</option>
                            <option value="Atacama">Atacama</option>
                            <option value="Coquimbo">Coquimbo</option>
                            <option value="Valparaíso">Valparaíso</option>
                            <option value="Metropolitana">Metropolitana de Santiago</option>
                            <option value="O'Higgins">Libertador Gral. Bernardo O'Higgins</option>
                            <option value="Maule">Maule</option>
                            <option value="Ñuble">Ñuble</option>
                            <option value="Biobío">Biobío</option>
                            <option value="La Araucanía">La Araucanía</option>
                            <option value="Los Ríos">Los Ríos</option>
                            <option value="Los Lagos">Los Lagos</option>
                            <option value="Aysén">Aysén del Gral. Carlos Ibáñez del Campo</option>
                            <option value="Magallanes">Magallanes y de la Antártica Chilena</option>
                        </select>
                        <span class="msj-error" id="error-region" style="color: #b42318; font-size: 0.85rem; display: block; margin-top: 0.2rem;"></span>
                    </div>

                    <!-- CAMPO MODIFICADO: Solo Comuna -->
                    <div class="campo-formulario">
                        <label for="comuna">Comuna:</label>
                        <input type="text" id="comuna" name="comuna" placeholder="Ej: La Florida">
                        <span class="msj-error" id="error-comuna" style="color: #b42318; font-size: 0.85rem; display: block; margin-top: 0.2rem;"></span>
                    </div>
                    <!--  Código Postal -->
                    <div class="campo-formulario">
                        <label for="codigoPostal">Código Postal:</label>
                        <input type="text" id="codigoPostal" name="codigoPostal" placeholder="Ej: 2520000">
                        <span class="msj-error" id="error-codigoPostal" style="color: #b42318; font-size: 0.85rem; display: block; margin-top: 0.2rem;"></span>
                    </div>

                    <div class="campo-formulario">
                        <label for="telefono">Teléfono de contacto:</label>
                        <input type="number" id="telefono" name="telefono" placeholder="Ej: 912345678">
                        <span class="msj-error" id="error-telefono" style="color: #b42318; font-size: 0.85rem; display: block; margin-top: 0.2rem;"></span>
                    </div>

                    <button type="button" id="boton-confirmar" class="boton-enviar">Confirmar Compra</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>Sonido Vivo</p>
        <p>Tienda de instrumentos musicales y equipos de audio.</p>
        <p>Viña del Mar, Región de Valparaíso, Chile.</p>
        <p>&copy; 2026 Sonido Vivo.</p>
    </footer>

    <script src="assets/js/confirmar-pedido.js"></script>
</body>
</html>
